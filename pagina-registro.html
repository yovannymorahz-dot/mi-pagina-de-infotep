<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    
    
    <link rel="stylesheet" href="estilo.css"
    >
</head>
<body>
    <main class="register-container">
        <header class="register-header">
            <h2>crear cuenta</h2>
            <p>registrate para comenzar</p>
        </header>

        <form class="register form" action="#" method="post">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellidos"required>
            </div>
           <div class="form-group">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="Tu correo electrónico" required>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contraseña" name="contrasena" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label for="confirmar-contraseña">Confirmar contraseña:</label>
                <input type="password" id="confirmar-contraseña" name="confirmar-contraseña" placeholder="••••••••" required>
            </div>
<button type="submit"class="botom3">Registrarse</button>
        </form>

    </main>
<footer class="register-footer">
        <p>¿Ya tienes una cuenta? <a href="login.html"><button class="botom3">Inicia sesión</button></a></p>
    </footer>
<a href="Homelab.html">   <button class="botom3"> Volver al inicio</button> </a>


</body>
</html>
